[workspace]
members = ["crates/gesang-api", "crates/gesang-core", "crates/gesang-plugins", "crates/gesang-client", "crates/gesang-host", "crates/gesang-services", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0-rc1"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/CodePrometheus/gesang"

[workspace.dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "original-uri"] }
base64 = "0.23.1"
chopin-protocol = { git = "https://github.com/CodePrometheus/chopin-ai.git", rev = "91251b63ed9beb2842b0d8bdaa7a07b792401902", version = "=0.7.0-rc2" }
chopin-job-broker = { git = "https://github.com/CodePrometheus/chopin-ai.git", rev = "6d90c60e8314ef72588b3f703dca60355029220a", version = "=0.7.0-rc2", features = ["transport"] }
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hmac = "0.13.0"
hkdf = "0.13.0"
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
jsonschema = { version = "0.61.2", default-features = false, features = ["idna"] }
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json", "form", "query"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
schemars = { version = "1.2.3", features = ["jiff02", "uuid1"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "sqlite", "uuid", "json", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
uniffi = { version = "0.32.2", features = ["tokio"] }
uuid = { version = "1.29.2", features = ["v4", "v5", "serde"] }
webpki-roots = "1.0.12"
zeroize = { version = "1.9.1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "deny"
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
