<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Gesang</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M16,16C7,12 9,3 15,5c5,2 3,8 1,11ZM16,16c1,-10 10,-13 11,-7 1,5 -5,7 -11,7ZM16,16c10,-2 15,5 10,9 -4,3 -8,-2 -10,-9ZM16,16c5,8 0,15 -5,11 -4,-3 0,-8 5,-11ZM16,16C8,22 1,18 5,13c3,-4 8,-1 11,3Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Gesang</span>
      </div>
      <div class="chatbar">
        <h1 id="chat-title">New chat</h1>
        <div id="model-picker" class="model-picker">
          <label for="model">Model</label>
          <select id="model" disabled><option value="">Loading models…</option></select>
        </div>
        <button id="history-toggle" class="icon-button history-toggle" type="button" aria-label="Conversations" aria-controls="sidebar" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </header>

    <aside id="sidebar" class="sidebar">
      <button id="new-chat" class="new-chat" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        New chat
      </button>
      <nav aria-labelledby="history-heading">
        <h2 id="history-heading">Conversations</h2>
        <p id="history-status" class="quiet" role="status">Loading conversations…</p>
        <ul id="conversations" class="conversation-list"></ul>
      </nav>
    </aside>

    <main class="chat">
      <div id="viewport" class="viewport">
        <div id="welcome" class="welcome chat-column">
          <svg width="48" height="48" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path d="M16,16C7,12 9,3 15,5c5,2 3,8 1,11ZM16,16c1,-10 10,-13 11,-7 1,5 -5,7 -11,7ZM16,16c10,-2 15,5 10,9 -4,3 -8,-2 -10,-9ZM16,16c5,8 0,15 -5,11 -4,-3 0,-8 5,-11ZM16,16C8,22 1,18 5,13c3,-4 8,-1 11,3Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h2>What would you like to work on?</h2>
          <p>Ask Gesang to run a command, write a script, or create a file in your workspace.</p>
        </div>
        <div id="messages" class="messages chat-column" role="log" aria-label="Messages" aria-relevant="additions"></div>
      </div>

      <div class="chat-footer chat-column">
        <div class="feedback">
          <p id="status" class="status" role="status" aria-atomic="true"></p>
          <button id="retry" class="text-button" type="button" hidden>Retry connection</button>
        </div>
        <p id="send-error" class="error" role="alert"></p>
        <form id="composer" class="composer" aria-labelledby="message-label">
          <label id="message-label" for="prompt">Message</label>
          <div class="composer-row">
            <textarea id="prompt" name="message" rows="2" placeholder="Message Gesang" required></textarea>
            <button id="send" class="send" type="submit" aria-label="Send message" disabled>
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 19V5m-6 6 6-6 6 6"/>
              </svg>
            </button>
          </div>
        </form>
        <details id="downloads" class="downloads">
          <summary id="download-heading">Download a file</summary>
          <form id="artifact-form" aria-labelledby="download-heading" class="artifact-form">
            <label for="artifact-name">Name of a file in <code>/workspace/exports</code></label>
            <div class="artifact-row">
              <input id="artifact-name" name="name" type="text" autocapitalize="off" spellcheck="false" required>
              <button id="download" class="secondary-button" type="submit">Download</button>
            </div>
            <p id="artifact-status" class="status" role="status"></p>
          </form>
        </details>
      </div>
    </main>
  </body>
</html>
